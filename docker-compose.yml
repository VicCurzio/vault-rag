services:
  db:
    image: pgvector/pgvector:pg17
    container_name: vault-rag-db
    environment:
      POSTGRES_USER: vaultrag
      POSTGRES_PASSWORD: vaultrag
      POSTGRES_DB: vaultrag
    # 55432: en esta maquina los puertos 5432 y 5433 ya los tiene un Postgres
    # instalado en Windows, y en Windows dos procesos pueden quedar escuchando
    # el mismo puerto sin error: gana cualquiera, y la conexion termina en el
    # Postgres equivocado con un "password authentication failed" enganoso.
    ports:
      - "55432:5432"
    volumes:
      - vault-rag-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultrag -d vaultrag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vault-rag-data:
